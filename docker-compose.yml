# This part was made with Claude Code. I do not want to dockerize this myself.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unified_help
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unified_help"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unified-help-network

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/unified_help
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - unified-help-network

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/unified_help
      SCRAPER_API_URL: http://scraper:4000
    ports:
      - "6701:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - unified-help-network

  scraper:
    build:
      context: ./scraper # this should point to the unified help scraper cloned repo!
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/unified_help
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - unified-help-network

volumes:
  db-data:

networks:
  unified-help-network:
    driver: bridge
